# Vérifie chaque PR avant sa fusion dans main : le typecheck du jeu et du serveur, puis la construction du jeu.
# Une fois main protégée (Settings → Rules → Rulesets), cocher « verifier » parmi les vérifications obligatoires.
name: Vérifier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build --base=./
